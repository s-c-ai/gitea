services:
  db:
    image: postgres:14
    container_name: soberana-postgres
    restart: always
    environment:
      POSTGRES_USER: soberana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: soberana
    volumes:
      - ./postgres:/var/lib/postgresql/data
    networks:
      - soberana
  server:
    image: docker.gitea.com/gitea:1.25.5-rootless
    container_name: soberana-gitea
    restart: always
    depends_on:
      - db
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: db:5432
      GITEA__database__NAME: soberana
      GITEA__database__USER: soberana
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD}

      GITEA__server__ROOT_URL: https://soberana.srv.br/
      GITEA__server__DOMAIN: soberana.srv.br
      GITEA__server__SSH_DOMAIN: soberana.srv.br
      GITEA__server__HTTP_PORT: 3000
      GITEA__server__SSH_PORT: 2222

      GITEA__security__INSTALL_LOCK: true
      GITEA__security__INTERNAL_TOKEN: ${GITEA_INTERNAL_TOKEN}
      GITEA__oauth2__JWT_SECRET: ${GITEA_JWT_SECRET}
      GITEA__server__LFS_JWT_SECRET: ${GITEA_LFS_JWT_SECRET}

      GITEA__ui__THEMES: gitea-auto,gitea-light,gitea-dark,soberana-dark,soberana-light
      GITEA__ui__DEFAULT_THEME: soberana-light
      GITEA__DEFAULT__APP_NAME: Soberana
      
    volumes:
      - ./data:/var/lib/gitea
      - ./config:/etc/gitea
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "5000:3000"
      - "2222:2222"
    networks:
      - soberana

networks:
  soberana:
    driver: bridge